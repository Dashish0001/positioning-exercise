
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Positioning Exercise | Product Showcase</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1 class="page-title">Product Showcase</h1>
  </header>

  <main class="product-grid">

    <!-- Product 1 -->
    <article class="product-card">

      <div class="product-image">

        <span class="sale-badge">SALE 30%</span>

        <button class="wishlist" aria-label="Add Running Sneakers to wishlist">
          ♡
        </button>

        <img
          src="images/sneakers-svgrepo-com.svg"
          alt="Running Sneakers"
          class="shoe"
        >

      </div>

      <div class="product-info">

        <h2>Running Sneakers</h2>

        <p>Lightweight everyday footwear</p>

        <h3>₹1,999 <del>₹2,899</del></h3>

        <button class="buy-button">Add to Cart</button>

      </div>

    </article>


    <!-- Product 2 -->
    <article class="product-card">

      <div class="product-image">

        <span class="sale-badge">SALE 20%</span>

        <button class="wishlist" aria-label="Add Sports Sneakers to wishlist">
          ♡
        </button>

        <img
          src="images/sneaker-shoe-svgrepo-com.svg"
          alt="Sports Sneakers"
          class="shoe"
        >

      </div>

      <div class="product-info">

        <h2>Sports Sneakers</h2>

        <p>Comfortable everyday sports shoes</p>

        <h3>₹2,499 <del>₹3,099</del></h3>

        <button class="buy-button">Add to Cart</button>

      </div>

    </article>


    <!-- Product 3 -->
    <article class="product-card">

      <div class="product-image">

        <span class="sale-badge">NEW</span>

        <button class="wishlist" aria-label="Add Outdoor Boots to wishlist">
          ♡
        </button>

        <img
          src="images/boot-line.svg"
          alt="Outdoor Boots"
          class="shoe"
        >

      </div>

      <div class="product-info">

        <h2>Outdoor Boots</h2>

        <p>Durable footwear for outdoor adventures</p>

        <h3>₹3,499 <del>₹4,299</del></h3>

        <button class="buy-button">Add to Cart</button>

      </div>

    </article>

  </main>


  <!-- Fixed Shopping Cart -->
  <button class="floating-cart">
    🛒 Cart
  </button>

</body>

</html>
